server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The API applies a stricter JSON-only policy.  The browser shell needs its
  # own headers too: otherwise an attacker can frame the login page or load a
  # script from another site before the first API request is ever made.
  include /etc/nginx/security-headers.conf;

  # A single-page app: every unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, so the browser never needs a CORS exemption and the token
  # never travels cross-site.
  location /api-proxy/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # A thousand-piece challan takes longer than the default minute.
    proxy_read_timeout 120s;
    client_max_body_size 4m;
  }

  # Public monitor target. It reaches the API's database-aware health probe
  # without exposing the rest of the API under a second path.
  location = /health {
    proxy_pass http://api:4000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Hashed asset filenames can be cached hard; index.html must never be.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
