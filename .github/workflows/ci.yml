name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; nobody needs a queue of stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — types, schema, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - run: npm ci
        working-directory: server

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      - name: Typecheck
        run: npm run typecheck
        working-directory: server

      # Builds the schema from scratch, runs the ten database invariants, then
      # the whole API suite against it. A run that depends on leftover data is
      # not a test run.
      - name: Tests on a database built from scratch
        run: ./test/run.sh
        working-directory: server

      - name: Upgrade from the previous deployed schema
        run: ./scripts/verify-upgrade.sh

      - name: Migration ledger and foreign-key indexes
        run: ./scripts/check-db-hygiene.sh linkerp_test

      - name: Backup restores into a separate database
        run: POSTGRES_DB=linkerp_test ./scripts/verify-backup-restore.sh

      # Every performance claim used to rest on a demo database of two thousand
      # pieces. This builds a year of a working mill and fails if a query a
      # person waits on crosses its budget.
      - name: Queries stay fast at a year's volume
        run: ./load/run.sh
        working-directory: link-erp/db

      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/link-erp-test-api.log || true

  web:
    name: web — types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: link-erp/package-lock.json
      - run: npm ci
        working-directory: link-erp
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: link-erp
      - run: npm run typecheck
        working-directory: link-erp
      - run: npm test
        working-directory: link-erp
      - run: npm run build
        working-directory: link-erp

  images:
    name: containers build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t link-erp-api ./server
      - run: docker build -t link-erp-web ./link-erp

  browser:
    name: browser — journeys, mobile, accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: e2e-only-secret
      CORS_ORIGIN: http://127.0.0.1:3010
      E2E_BASE_URL: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            link-erp/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: link-erp
      - name: Build browser-test database
        run: |
          ./link-erp/db/rebuild.sh linkerp_e2e
          psql -d linkerp_e2e -c "alter role link_erp_app password 'e2e-only-password'"
      - name: Start API and web
        run: |
          DATABASE_URL=postgresql://link_erp_app:e2e-only-password@127.0.0.1:5432/linkerp_e2e PORT=4000 npm --prefix server start > /tmp/e2e-api.log 2>&1 &
          VITE_API_BASE=http://127.0.0.1:4000 npm --prefix link-erp run dev -- --host 127.0.0.1 --port 3010 > /tmp/e2e-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3010 >/dev/null && exit 0; sleep 1; done
          tail -100 /tmp/e2e-api.log /tmp/e2e-web.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: link-erp
      - run: npm run test:e2e
        working-directory: link-erp
      - name: Browser logs on failure
        if: failure()
        run: tail -100 /tmp/e2e-api.log /tmp/e2e-web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: link-erp/playwright-report
